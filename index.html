<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>روبوت اللوحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* Layout idea: a two-pane workbench. The board sits on one side, the code on the other; the four levels run as a stamped strip across the top. */
:root{
  --bg:#eef3f5; --surface:#ffffff; --ink:#10233f; --muted:#5a6b80; --accent:#0c9a94; --gold:#d99a1c;
  --wall:#1f3a5f; --line:#d6e0e8; --soft:#e3eef0; --good:#1f9a55; --bad:#d04848; --warn:#d98300;
  --font-display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-code:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a141f; --surface:#111f2e; --ink:#e6eef5; --muted:#9db0c3; --accent:#2cc4bc; --gold:#f0b940;
  --wall:#3b6190; --line:#23384d; --soft:#16293b; --good:#3cc47a; --bad:#ff6b6b; --warn:#ffad33; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a141f; --surface:#111f2e; --ink:#e6eef5; --muted:#9db0c3; --accent:#2cc4bc; --gold:#f0b940;
  --wall:#3b6190; --line:#23384d; --soft:#16293b; --good:#3cc47a; --bad:#ff6b6b; --warn:#ffad33; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5rem .9rem}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1b1300;font-weight:700}
.btn-ghost{background:transparent}
.btn-bad{border-color:var(--bad);color:var(--bad);background:transparent}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:1.6rem;color:var(--ink)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;padding:.2rem .7rem;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.live{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.pill:empty{display:none}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:12px}
.center{display:grid;place-items:center;min-height:60vh;text-align:center}
.hidden{display:none!important}
/* register */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gcard{border:2px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;background:var(--surface);display:grid;gap:4px}
.gcard .gl{font-family:var(--font-display);font-size:2rem;line-height:1;color:var(--g)}
.gcard[aria-pressed="true"]{border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 25%,transparent)}
.gcard.taken{opacity:.5}
/* play */
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{position:relative;text-align:start;display:grid;gap:2px;padding:.55rem .8rem}
.lv .n{font-family:var(--font-display);font-size:1.15rem}
.lv .s{font-size:.8rem;color:var(--muted)}
.lv[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.lv .stamp{position:absolute;inset-inline-end:8px;bottom:6px;font-family:var(--font-display);font-size:.85rem;color:var(--good);border:2px solid var(--good);border-radius:6px;padding:0 6px;transform:rotate(-8deg)}
.lv .stamp.skip{color:var(--muted);border-color:var(--muted)}
.stamp.pop{animation:stamp .45s ease-out}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.bench{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:14px;align-items:start}
@media (max-width:860px){.bench{grid-template-columns:1fr}}
.boards{display:grid;gap:10px}
.boards.two{grid-template-columns:1fr 1fr}
.bwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.bwrap .cap{font-size:.85rem;color:var(--muted);padding:0 4px 4px}
svg.board{display:block;width:100%;height:auto;direction:ltr}
.cell{fill:var(--soft)} .wallc{fill:var(--wall)} .gridl{stroke:var(--line);stroke-width:1}
.trail{fill:var(--accent);opacity:.35}
.robot-move{transition:transform var(--step,280ms) ease-in-out}
.robot-rot{transition:transform var(--step,280ms) ease-in-out}
.crash{fill:var(--bad);opacity:0}
.crash.on{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.task h2{font-size:1.35rem}
.need{display:inline-block;font-size:.8rem;padding:.1rem .55rem;border-radius:6px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--ink)}
.editor{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);direction:ltr}
.gutter{margin:0;padding:12px 8px;text-align:right;color:var(--muted);background:var(--soft);font:15px/1.6 var(--font-code);user-select:none;min-width:2.6em;overflow:hidden}
.gutter .err{color:#fff;background:var(--bad);border-radius:4px;padding:0 3px}
textarea.code{border:0;outline:0;resize:vertical;min-height:300px;padding:12px;font:15px/1.6 var(--font-code);color:var(--ink);background:var(--surface);white-space:pre;overflow:auto;tab-size:4}
textarea.code:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;direction:ltr;justify-content:flex-end}
.chip{font:14px var(--font-code);padding:.25rem .6rem;background:var(--soft);border-color:transparent}
.console{border-radius:var(--r);padding:12px 14px;background:var(--soft);min-height:3.2em}
.console.good{background:color-mix(in srgb,var(--good) 15%,var(--surface));}
.console.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface));}
.console .raw{direction:ltr;text-align:left;font:13px/1.5 var(--font-code);color:var(--muted);margin-top:6px;white-space:pre-wrap}
.hints{display:grid;gap:8px}
.hint{border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.hint.open{border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
code,.mono{font-family:var(--font-code);direction:ltr;unicode-bidi:isolate}
.ring{width:54px;height:54px}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .3s}
.ring.amber .fg{stroke:var(--warn)} .ring.red .fg{stroke:var(--bad)}
.timebox{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.score{font-family:var(--font-display);font-size:1.5rem;color:var(--accent);font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.overlay .card{max-width:440px;text-align:center;display:grid;gap:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:.5rem .5rem;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-size:.85rem;color:var(--muted);font-weight:500}
.tscroll{overflow-x:auto}
.lvdots{display:flex;gap:4px}
.lvdots span{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.75rem;background:var(--soft);color:var(--muted)}
.lvdots span.ok{background:var(--good);color:#fff}
.lvdots span.sk{background:var(--line);color:var(--muted)}
.lvdots span.cur{outline:2px solid var(--accent)}
.gtag{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;color:#fff;font-family:var(--font-display);font-size:1.05rem;background:var(--g)}
pre.key{direction:ltr;text-align:left;font:13px/1.5 var(--font-code);background:var(--soft);padding:10px;border-radius:8px;margin:0;white-space:pre}
/* projector */
.screen{max-width:1100px;margin:0 auto;padding:24px}
.screen h1{font-size:clamp(2rem,4vw,3.2rem)}
.rank{display:grid;gap:10px;position:relative}
.rrow{display:grid;grid-template-columns:56px 1fr auto auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;font-size:1.4rem}
.rrow .pos{font-family:var(--font-display);font-size:2rem;color:var(--muted);text-align:center}
.rrow .nm{display:flex;gap:12px;align-items:center;font-weight:700}
.rrow .sc{font-family:var(--font-display);font-size:2.2rem;color:var(--accent);min-width:3ch;text-align:end}
.rrow .lvdots span{width:30px;height:30px;font-size:1rem}
.banner{font-family:var(--font-display);font-size:1.4rem;padding:.3rem 1rem;border-radius:10px;background:var(--soft)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.foot{display:flex;gap:14px;justify-content:center;padding:18px;font-size:.85rem}
.foot a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

  <span class="pill" id="who"></span>

<main id="app"></main>
<nav class="foot" id="foot"><a href="#team">شاشة الطالب</a><a href="#mentor">لوحة المرشد</a><a href="#screen">شاشة العرض</a></nav>

  async supaLoad(first){
    const {data,error}=await this.sb.from(TABLE).select("path,data");
    if(error){ console.warn(error); netState="slow"; setNet(); if(first) throw error; return; }
    const seen=new Set(), changed=new Set();
    for(const row of data||[]){ seen.add(row.path); const old=this.cache.get(row.path); const s=JSON.stringify(row.data);
      if(!old || JSON.stringify(old)!==s){ this.cache.set(row.path,row.data); changed.add(row.path); } }
    for(const p of [...this.cache.keys()]) if(!seen.has(p) && !this.pending(p)){ this.cache.delete(p); changed.add(p); }
    changed.forEach(p=>this.emit(p));

  supaLive(){
    let t=setTimeout(()=>{ if(netState!=="live"){ netState="slow"; setNet(); } },10000);
    this.sb.channel("rb-all").on("postgres_changes",{event:"*",schema:"public",table:TABLE},pl=>{
      if(pl.eventType==="DELETE"){ const p=pl.old&&pl.old.path; if(p){ this.cache.delete(p); this.emit(p); } }

    }).subscribe(st=>{ if(st==="SUBSCRIBED"){ clearTimeout(t); netState="live"; setNet(); } else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){ netState="slow"; setNet(); } });

  lget(path){ return LS.get("rb5db:"+path,null); },

  readColl(coll){
    const out=[]; const pre=coll+"/";

    else { try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith("rb5db:"+pre)){ const id=k.slice(("rb5db:"+pre).length); if(!id.includes("/")) out.push({id,data:LS.get(k,null)}); } } }catch(e){} }

const MAX_STEPS=200;
function skulptReady(){ return typeof window.Sk!=="undefined" && Sk.misceval; }
function runOnBoard(code,b){
  const sim={r:b.start[0],c:b.start[1],d:b.start[2],steps:0,done:false,status:null};
  const actions=[]; let output="";
  const blocked=(r,c)=> r<0||c<0||r>=b.n||c>=b.n||b.walls.has(r+","+c);
  const stop=st=>{ sim.status=st; throw new Sk.builtin.RuntimeError("__robot_stop__"); };
  const tick=()=>{ sim.steps++; if(sim.steps>MAX_STEPS) stop("toomany"); };
  const noArgs=(name,args)=>{ if(args.length) throw new Sk.builtin.TypeError(name+"() takes no arguments"); };
  Sk.builtins.forward=new Sk.builtin.func(function(){ noArgs("forward",arguments); if(sim.done) return Sk.builtin.none.none$; tick();
    const [dr,dc]=DIRS[sim.d], r=sim.r+dr, c=sim.c+dc;
    if(blocked(r,c)){ actions.push({t:"X",r,c}); stop("crash"); }
    sim.r=r; sim.c=c; actions.push({t:"F",r,c}); if(r===b.star[0]&&c===b.star[1]) sim.done=true; return Sk.builtin.none.none$; });
  Sk.builtins.left=new Sk.builtin.func(function(){ noArgs("left",arguments); if(sim.done) return Sk.builtin.none.none$; tick(); sim.d=(sim.d+3)%4; actions.push({t:"L"}); return Sk.builtin.none.none$; });
  Sk.builtins.right=new Sk.builtin.func(function(){ noArgs("right",arguments); if(sim.done) return Sk.builtin.none.none$; tick(); sim.d=(sim.d+1)%4; actions.push({t:"R"}); return Sk.builtin.none.none$; });
  Sk.builtins.wall_ahead=new Sk.builtin.func(function(){ noArgs("wall_ahead",arguments); const [dr,dc]=DIRS[sim.d]; return blocked(sim.r+dr,sim.c+dc)?Sk.builtin.bool.true$:Sk.builtin.bool.false$; });
  Sk.configure({output:t=>{ if(output.length<4000) output+=t; }, read:f=>{ if(Sk.builtinFiles && Sk.builtinFiles.files[f]!==undefined) return Sk.builtinFiles.files[f]; throw "File not found: '"+f+"'"; }, __future__:Sk.python3, execLimit:4000});
  return Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,code,true))
    .then(()=>({status: sim.done?"star":"notstar", actions, output, steps:sim.steps}),
          err=>{ if(sim.status) return {status:sim.status, actions, output, steps:sim.steps}; return {status:"error", err:parseErr(err), actions, output, steps:sim.steps}; });
}
function parseErr(e){
  let name="Error", msg="", line=null;
  try{ name=e.tp$name || (e.constructor&&e.constructor.name) || "Error"; }catch(_){}
  try{ msg=e.args.v.map(x=>x.v!==undefined?x.v:String(x)).join(" "); }catch(_){ msg=String(e); }
  try{ line=e.traceback && e.traceback[0] && e.traceback[0].lineno; }catch(_){}

}
const CMDS=["forward","left","right","wall_ahead"];
function lev(a,b){ const m=[...Array(a.length+1)].map((_,i)=>[i]); for(let j=1;j<=b.length;j++) m[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return m[a.length][b.length]; }
function explain(err,code){
  const lines=code.split("\n"), L=err.line||1, cur=(lines[L-1]||""), prev=(lines[L-2]||"");
  const ind=s=>s.match(/^\s*/)[0].replace(/\t/g,"    ").length;
  const at=" بسطر "+L+".";
  if(err.name==="SyntaxError"||err.name==="IndentationError"||err.name==="TabError"){
    for(const s of [cur,prev]){ if(/^\s*(if|elif|while)\b[^#]*[^=!<>]=[^=]/.test(s)) return "بالشرط استعملوا `==` مش `=` (SyntaxError)"+at; }
    for(const [s,ln] of [[cur,L],[prev,L-1]]){ const t=s.replace(/#.*$/,"").trim(); if(/^(for|if|elif|else|def|while)\b/.test(t) && !t.endsWith(":")) return "ناقص `:` بآخر السطر "+ln+" (SyntaxError)."; }
    const p=prev.replace(/#.*$/,"").trim();
    if(p.endsWith(":") && ind(cur)<=ind(prev)) return "السطر "+L+" لازم يبلّش بـ 4 مسافات، لأنه تحت سطر فيه `:` (IndentationError).";
    if(L>1 && !p.endsWith(":") && ind(cur)>ind(prev) && cur.trim()) return "في مسافات زيادة بأول السطر "+L+" (IndentationError).";
    return "غلطة كتابة (SyntaxError)"+at+" افحصوا الأقواس `()` والنقطتين `:` وعلامات الاقتباس.";
  }

    const m=/name '([^']+)'/.exec(err.msg), nm=m?m[1]:"";
    const near=CMDS.find(c=>lev(c,nm)<=2);
    if(near) return "الاسم `"+nm+"` مش معروف"+at+" قصدكم `"+near+"()`؟ (NameError)";
    return "الاسم `"+nm+"` مش معروف هون"+at+" يمكن غلطة إملاء، أو متغير انعمل جوّا دالة وبتستعملوه برّاها (المدى، Scope).";

}
function stripComments(code){ return code.split("\n").map(l=>l.replace(/#.*$/,"")).join("\n"); }
function countLines(code){ return stripComments(code).split("\n").filter(l=>l.trim()).length; }
function needMet(lv,code){

/* ---------------- scoring (always derived) ---------------- */
function scoreOf(t,adj){
  const items=[]; adj=adj||{};
  if(!t) return {total:0,items};
  for(const L of LEVELS){
    const s=(t.levels||{})[L.n]||{};
    if(s.solved){ items.push(["حل مستوى "+L.n, COST.solve]); if(s.fails>0) items.push(["مستوى "+L.n+": نجحتوا بعد غلط", COST.retry]); }
    const h=s.hints||0; if(h>=1) items.push(["تلميح 1، مستوى "+L.n, -COST.hint[0]]); if(h>=2) items.push(["تلميح 2، مستوى "+L.n, -COST.hint[1]]);
  }
  const ex=Math.max(0,(t.exits||0)-(adj.refunds||0)); if(ex) items.push(["خروج من التطبيق ×"+ex, -COST.exit*ex]);
  if(adj.verbal) items.push(["تلميح شفهي ×"+adj.verbal, -COST.verbal*adj.verbal]);
  if(adj.bonus) items.push(["بونص المرشد ×"+adj.bonus, COST.bonus*adj.bonus]);
  return {total:items.reduce((a,b)=>a+b[1],0), items};
}

function animate(v,res){
  return new Promise(done=>{
    const step=+$("#speed").value; v.el.style.setProperty("--step",Math.round(step*0.9)+"ms");
    let i=0, [r,c]=[v.b.start[0],v.b.start[1]]; addTrail(v,r,c);
    const next=()=>{
      if(stopFlag || i>=res.actions.length){ done(); return; }
      const a=res.actions[i++];
      if(a.t==="F"){ r=a.r; c=a.c; placeRobot(v,r,c); addTrail(v,r,c); beep("step"); }
      else if(a.t==="L"){ v.angle-=90; placeRobot(v,r,c); }
      else if(a.t==="R"){ v.angle+=90; placeRobot(v,r,c); }
      else if(a.t==="X"){ const ns=v.crash; ns.setAttribute("x",Math.max(-CS,Math.min(v.b.n*CS,a.c*CS))+2); ns.setAttribute("y",Math.max(-CS,Math.min(v.b.n*CS,a.r*CS))+2);
        ns.classList.remove("on"); void ns.getBoundingClientRect(); ns.classList.add("on"); v.svg.classList.remove("shake"); void v.svg.getBoundingClientRect(); v.svg.classList.add("shake"); }
      setTimeout(next, reduced? Math.min(step,120) : step);
    };
    setTimeout(next,120);
  });
}

  const rows=ps.map(p=>{ const a=adjusts[p.id]||{}; const r=[p.name,p.team,(GMAP[p.group]||{}).label||""];
    LEVELS.forEach(L=>{ const s=(p.levels||{})[L.n]||{}; r.push(s.solved?"حل":(s.skipped?"تخطّى":(s.runs?"ما خلّص":"ما وصل")), s.time!=null?(s.time/60).toFixed(1):"", s.runs||0, s.fails||0, s.hints||0, s.lines||""); });
    r.push(Math.max(0,(p.exits||0)-(a.refunds||0)), a.verbal||0, a.bonus||0, p.score.total); return r; });
  return [head,...rows].map(r=>r.map(x=>String(x).replace(/[\t\n]/g," ")).join("\t")).join("\n");
}

function adjust(id,field){ const a={refunds:0,verbal:0,bonus:0,...(adjusts[id]||{})}; a[field]=(a[field]||0)+1; adjusts[id]=a; Store.set("adjust/"+id,a); renderMentor(); }
function lvDots(t){ return `<span class="lvdots">${LEVELS.map(L=>{ const s=(t.levels||{})[L.n]||{}; const cls=s.solved?"ok":(s.skipped?"sk":(t.level===L.n&&!t.done?"cur":"")); return `<span class="${cls}" title="مستوى ${L.n}">${s.solved?"✓":L.n}</span>`; }).join("")}</span>`; }
function bestTxt(arr){ if(!arr.length) return "لسا"; const names=arr.slice(0,3).map(x=>esc(x.name)).join("، "); return names+(arr.length>3?` و${arr.length-3} غيرهم`:"")+` (${arr[0].lines} أسطر)`; }
function bestCode(ts){ const out={2:[],3:[]}; for(const n of [2,3]){ const xs=ts.filter(t=>t.levels&&t.levels[n]&&t.levels[n].solved&&t.levels[n].lines); if(!xs.length) continue; const m=Math.min(...xs.map(t=>t.levels[n].lines)); out[n]=xs.filter(t=>t.levels[n].lines===m).map(t=>({name:t.name,lines:m})); } return out; }

let lastPos={};

  const best=bestCode(all); const solvedAll=all.filter(t=>t.levels&&t.levels[4]&&t.levels[4].solved).length;
  const prev={}; app.querySelectorAll(".rrow").forEach(r=>prev[r.dataset.id]=r.getBoundingClientRect().top);
  app.innerHTML=`<div class="screen stack">
    <div class="row" style="justify-content:space-between"><h1>لغز اللوحة 3: الروبوت ببايثون</h1>
      <span class="banner">${{lobby:"استنّوا البداية",running:"اللعبة شغّالة",paused:"واقفة مؤقتًا"}[st]||""}</span></div>

    <p class="muted" style="margin:0">نقاط الفريق = معدل نقاط طلابه. الأرقام الصغيرة: كم واحد بالفريق حل كل مستوى.</p>
    <div class="rank">${ts.map((t,i)=>`<div class="rrow" data-id="${esc(t.name)}"><span class="pos">${i+1}</span>
      <span class="nm">${esc(t.name)} <span class="muted" style="font-weight:400;font-size:1rem">${t.n} طلاب</span></span>
      <span class="lvdots">${t.solved.map((c,j)=>`<span class="${c===t.n&&t.n?"ok":""}" title="مستوى ${j+1}" style="width:auto;padding:0 .5rem">${c}/${t.n}</span>`).join("")}</span>
      <span class="sc" data-v="${t.avg}">${t.avg}</span></div>`).join("") || `<div class="card muted" style="font-size:1.3rem">الفرق رح تظهر هون لما الطلاب يسجّلوا.</div>`}</div></div>`;
  if(!reduced) app.querySelectorAll(".rrow").forEach(r=>{ const p=prev[r.dataset.id]; if(p==null) return; const d=p-r.getBoundingClientRect().top; if(!d) return;
    r.style.transform=`translateY(${d}px)`; r.style.transition="none"; requestAnimationFrame(()=>{ r.style.transition="transform .6s ease"; r.style.transform=""; }); });
  app.querySelectorAll(".rrow .sc").forEach(el=>{ const id=el.parentElement.dataset.id, to=+el.dataset.v, from=lastPos[id]; lastPos[id]=to;
    if(from==null||from===to||reduced) return; const t0=performance.now(); (function f(t){ const k=Math.min(1,(t-t0)/600); el.textContent=(Math.round((from+(to-from)*k)*10)/10); if(k<1) requestAnimationFrame(f); })(t0); });
}

/* ================= ROUTER ================= */
let view="team";
function route(){
  const h=(location.hash||"").replace("#","");
  view= h==="mentor"?"mentor": h==="screen"?"screen":"team";
  $("#foot").classList.toggle("hidden", view==="screen");
  ui.mode=null;
  if(view==="team"){ me=LS.get("rb5:me",null)||freshMe(); if(!me.teamId) me=freshMe(); renderTeam(); }
  else if(view==="mentor") renderMentor(); else renderScreen();
}
window.addEventListener("hashchange",route);
(async function boot(){
  $("#app").innerHTML=`<div class="wrap center"><div class="muted">بيتحمّل…</div></div>`;
  await Store.init();
  subControl(); subPlayers(); subAdjust(); subAssign();
  route();
  if(!skulptReady()) setTimeout(()=>{ if(!skulptReady() && view==="team"){ const o=$("#out"); if(o) setOut("بايثون ما تحمّلت. افحصوا الإنترنت وحدّثوا الصفحة.","bad"); } },12000);
})();
